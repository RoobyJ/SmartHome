name: local-smarthome
services:
  smarthome.api:
    image: smarthome.api
    build:
      context: .
      dockerfile: Dockerfile.API
    ports:
      - "8080:8080"
    networks:
      - host-docker-internal-net
    environment:
      - ConnectionStrings__DefaultConnection=User ID=test;Password=test123;Host=host.docker.internal;Port=5432;Database=SmartHome;
  smarthome.client:
    image: smarthome.client
    build:
      context: .
      dockerfile: Dockerfile.Client
    depends_on:
      - smarthome.api
    networks:
      - host-docker-internal-net
    ports:
      - "8081:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ReverseProxy__Clusters__api__Destinations__api__Address=http://host.docker.internal:8080

networks:
  host-docker-internal-net:
